
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Money</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 40px;
            color: #243247;
        }

        .card {
            max-width: 420px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000012;
        }

        h1 { color: #173e70; }

        label {
            display: block;
            margin: 15px 0 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccd5e0;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #16803c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .message { color: #173e70; }
        .back { display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h1>Deposit Money</h1>

    <p class="message"
       th:if="${message}"
       th:text="${message}"></p>

    <form th:action="@{/deposit}" method="post">
        <label for="amount">Deposit Amount (₹)</label>

        <input
                type="number"
                id="amount"
                name="amount"
                min="0.01"
                step="0.01"
                placeholder="Enter amount"
                required>

        <button type="submit">Deposit Money</button>
    </form>

    <a class="back" th:href="@{/dashboard}">
        ← Back to Dashboard
    </a>
</div>

</body>
</html>
